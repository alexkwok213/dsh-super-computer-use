<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" role="img" aria-label="让 DSH 真正操作 Mac 应用">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8ff"/><stop offset="1" stop-color="#eef1fd"/>
    </linearGradient>
    <linearGradient id="cmd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fafbff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3d4a86" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5b7cf0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="470" rx="18" fill="url(#bg)"/>

  <rect x="56" y="38" width="4" height="14" rx="2" fill="#4a6cf7"/>
  <text x="70" y="51" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#4a6cf7">COMPUTER USE</text>
  <text x="56" y="101" font-family="Songti SC,STSong,Georgia,serif" font-size="38" font-weight="700" fill="#1b2136">让 DSH 真正操作 Mac 应用</text>
  <text x="56" y="133" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="16" fill="#4c566f">查看界面、点击控件、在目标应用内落笔</text>
  <text x="56" y="157" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="11.5" fill="#8a91a8">过程真实性：参考图只用于构图校验，成品必须由目标应用内的笔画构成</text>

  <g filter="url(#soft)">
    <rect x="56" y="190" width="300" height="172" rx="14" fill="url(#cmd)" stroke="#e2e6f4" stroke-width="1"/>
  </g>
  <text x="82" y="222" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="12" fill="#8a91a8">你的指令</text>
  <text x="82" y="266" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="21" font-weight="600" fill="#1b2136">在 Freeform 里</text>
  <text x="82" y="296" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="21" font-weight="600" fill="#1b2136">画出这幅参考图</text>
  <rect x="82" y="320" width="112" height="22" rx="11" fill="#eef1ff"/>
  <text x="94" y="335" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10.5" font-weight="600" fill="#4a6cf7">PTC · macOS</text>

  <line x1="372" y1="276" x2="452" y2="276" stroke="#5b7cf0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#soft)">
    <rect x="480" y="180" width="584" height="192" rx="12" fill="#ffffff" stroke="#dfe4f2" stroke-width="1"/>
  </g>
  <path d="M492 180 H1052 A12 12 0 0 1 1064 192 V212 H480 V192 A12 12 0 0 1 492 180 Z" fill="#f4f6fb"/>
  <circle cx="503" cy="196" r="5" fill="#ff6058"/><circle cx="521" cy="196" r="5" fill="#ffbd2e"/><circle cx="539" cy="196" r="5" fill="#28c840"/>
  <text x="772" y="201" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="11.5" font-weight="600" fill="#6b7285">无边记</text>
  <line x1="480" y1="212" x2="1064" y2="212" stroke="#e6e9f3" stroke-width="1"/>

  <path d="M690 286 C730 231 830 231 870 286 C830 341 730 341 690 286 Z" fill="none" stroke="#4a6cf7" stroke-width="3.5" stroke-linecap="round"/>
