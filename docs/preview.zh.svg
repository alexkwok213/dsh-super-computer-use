  <path d="M715 316 C755 306 805 306 845 316" fill="none" stroke="#e36f9a" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="845" cy="274" r="5.5" fill="#1b2136"/>
  <circle cx="900" cy="250" r="5" fill="none" stroke="#9aa4c4" stroke-width="1.5"/>
  <circle cx="918" cy="236" r="3" fill="none" stroke="#9aa4c4" stroke-width="1.5"/>

  <rect x="500" y="340" width="228" height="22" rx="11" fill="#eef7f2"/>
  <text x="512" y="355" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="10.5" font-weight="600" fill="#2e8b63">笔画对象 18 · 目标应用内生成</text>

  <g><rect x="56" y="402" width="228" height="38" rx="19" fill="#ffffff" stroke="#e2e6f4" stroke-width="1"/><circle cx="77" cy="421" r="11" fill="#4a6cf7"/><text x="77" y="425" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="700" fill="#ffffff">1</text><text x="97" y="425" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="11.5" font-weight="600" fill="#3b445c">路由  cu_route</text></g>
  <g><rect x="316" y="402" width="228" height="38" rx="19" fill="#ffffff" stroke="#e2e6f4" stroke-width="1"/><circle cx="337" cy="421" r="11" fill="#4a6cf7"/><text x="337" y="425" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="700" fill="#ffffff">2</text><text x="357" y="425" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="11.5" font-weight="600" fill="#3b445c">建图  cu_discover</text></g>
  <g><rect x="576" y="402" width="228" height="38" rx="19" fill="#ffffff" stroke="#e2e6f4" stroke-width="1"/><circle cx="597" cy="421" r="11" fill="#4a6cf7"/><text x="597" y="425" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="700" fill="#ffffff">3</text><text x="617" y="425" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="11.5" font-weight="600" fill="#3b445c">单步验证  cu_expect</text></g>
  <g><rect x="836" y="402" width="228" height="38" rx="19" fill="#ffffff" stroke="#e2e6f4" stroke-width="1"/><circle cx="857" cy="421" r="11" fill="#4a6cf7"/><text x="857" y="425" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="700" fill="#ffffff">4</text><text x="877" y="425" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="11.5" font-weight="600" fill="#3b445c">批量执行  cu_batch</text></g>
  <text x="1064" y="458" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" font-size="10.5" fill="#9aa1b5">四阶段认知协议 · 先想清楚再动手</text>
